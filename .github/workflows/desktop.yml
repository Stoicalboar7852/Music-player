# Builds the desktop app (desktop/) for macOS and Windows, tests the packaged
# app on each, and keeps the installers as downloads on the run's page.
# Pushing a version tag (v2.0.0 ...) also attaches them to a GitHub release.
#
# The installers are not signed with a paid developer certificate: macOS
# builds are ad-hoc signed and Windows builds are unsigned. See the README
# (Desktop app) for how to open them the first time.

name: Desktop app

on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: [v2, v3, main]
    paths:
      - 'desktop/**'
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - '.github/workflows/desktop.yml'

permissions:
  contents: write

# A newer push waits for the run in progress rather than cancelling it (macOS
# machines can take a while to come free, and a cancelled run builds nothing).
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            builder: --mac
            app: release/mac-arm64/Phosphor.app/Contents/MacOS/Phosphor
          - name: Windows
            os: windows-latest
            builder: --win
            app: release/win-unpacked/Phosphor.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      # Optional (see below): an EVS account for production Widevine VMP signing.
      EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Build the web app into desktop/web
        run: |
          npm ci
          npm run desktop:web

      - name: Install Electron and electron-builder
        working-directory: desktop
        run: npm ci

      # koffi (the NDI output calls the NDI runtime through it) ships its
      # native part per platform; npm installs only this runner's, and the
      # Mac job also builds for Intel.
      - name: Add koffi's Intel Mac binary
        if: runner.os == 'macOS'
        working-directory: desktop
        run: npm install --no-save --force @koromix/koffi-darwin-x64@3.3.8

      # librespot, for the optional (off by default) Spotify playback through
      # it: built from source for each architecture the installers cover,
      # with rustls (no OpenSSL) and only its pipe output.
      - name: Cache librespot's build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/librespot/target
          key: librespot-0.8.0-${{ runner.os }}-v1

      - name: Build librespot
        shell: bash
        run: |
          if [ ! -d "$RUNNER_TEMP/librespot/.git" ]; then
            rm -rf "$RUNNER_TEMP/librespot"
            git clone --depth 1 --branch v0.8.0 https://github.com/librespot-org/librespot "$RUNNER_TEMP/librespot"
          fi
          cd "$RUNNER_TEMP/librespot"
          build() {
            cargo build --release --locked --no-default-features --features rustls-tls-webpki-roots --target "$1"
            mkdir -p "$GITHUB_WORKSPACE/desktop/bin/$2"
            cp "target/$1/release/librespot$3" "$GITHUB_WORKSPACE/desktop/bin/$2/"
            cp LICENSE "$GITHUB_WORKSPACE/desktop/bin/$2/librespot-LICENSE.txt"
          }
          if [ "$RUNNER_OS" = "macOS" ]; then
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
            build aarch64-apple-darwin mac-arm64 ""
            build x86_64-apple-darwin mac-x64 ""
          else
            rustup target add x86_64-pc-windows-msvc
            build x86_64-pc-windows-msvc win-x64 .exe
          fi
          ls -R "$GITHUB_WORKSPACE/desktop/bin"

      - name: Test the local server, the control API, cue sync, NDI and the icons
        working-directory: desktop
        run: npm test

      # Production Widevine VMP signing (castLabs EVS), when the repository has
      # an EVS account in its secrets; otherwise builds keep castLabs'
      # development signature. See the README, Desktop app.
      - name: Install castLabs EVS (VMP signing)
        if: env.EVS_ACCOUNT_NAME != ''
        run: python3 -m pip install --upgrade castlabs-evs

      - name: Build the installers
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
        run: npx electron-builder ${{ matrix.builder }} --publish never

      - name: Smoke-test the packaged app
        working-directory: desktop
        run: node smoke-test.mjs "${{ matrix.app }}"

      - name: Keep the installers and the smoke test's report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Phosphor-${{ matrix.name }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            desktop/release/*.dmg
            desktop/release/*.exe
            desktop/release/smoke-*

      - name: Attach the installers to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/release/*.dmg
            desktop/release/*.exe
